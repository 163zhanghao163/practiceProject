<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小游戏 & 工具合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(0, 229, 255, .6);
  }
  p.subtitle { color: #9fb4d0; margin-bottom: 36px; }
  section { width: 100%; max-width: 1080px; margin-bottom: 36px; }
  section > h2 {
    font-size: 1.15rem;
    letter-spacing: 2px;
    color: #cfeaff;
    padding-left: 12px;
    border-left: 4px solid #00e5ff;
    margin-bottom: 16px;
  }
  section.tools > h2 { border-color: #7aff8a; color: #d8ffd8; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
    gap: 24px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: #fff;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 16px;
    padding: 28px 24px;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  a.card:hover {
    transform: translateY(-6px);
    border-color: #00e5ff;
    box-shadow: 0 12px 30px rgba(0, 229, 255, .18);
  }
  section.tools a.card:hover {
    border-color: #7aff8a;
    box-shadow: 0 12px 30px rgba(122, 255, 138, .15);
  }
  .icon { font-size: 3rem; margin-bottom: 14px; }
  a.card h3 { font-size: 1.3rem; margin-bottom: 8px; }
  a.card p { color: #9fb4d0; font-size: .95rem; line-height: 1.5; }
  footer { margin-top: 20px; color: #5a6b85; font-size: .85rem; }
  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    h1 { font-size: 1.6rem; }
    p.subtitle { margin-bottom: 24px; }
    a.card { padding: 20px 18px; }
  }
</style>
</head>
<body>
  <h1>🎮 小游戏 & 工具合集</h1>
  <p class="subtitle">选择一个开始</p>

  <section>
    <h2>🎮 游戏</h2>
    <div class="grid">
      <a class="card" href="./puzzle-game/index.html">
        <div class="icon">🧩</div>
        <h3>拼图小游戏</h3>
        <p>经典滑块拼图玩法，把打乱的碎块还原成完整图片。</p>
      </a>
      <a class="card" href="./drag-puzzle-game/index.html">
        <div class="icon">🖱️</div>
        <h3>拖拽拼图</h3>
        <p>拖拽碎块交换位置，考验观察力与耐心。</p>
      </a>
      <a class="card" href="./pixel-adventure/index.html">
        <div class="icon">🕹️</div>
        <h3>像素大冒险</h3>
        <p>像素风横版闯关：跳跃、躲避、收集金币，闯过所有关卡！</p>
      </a>
      <a class="card" href="./roguelike-arena/index.html">
        <div class="icon">⚔️</div>
        <h3>像素勇者 · 怪物围城</h3>
        <p>肉鸽割草：大地图走位，升级三选一天赋，限时存活与无尽刷分两种模式！</p>
      </a>
    </div>
  </section>

  <section class="tools">
    <h2>🛠️ 工具</h2>
    <div class="grid">
      <a class="card" href="./token-usage-tracker/index.html">
        <div class="icon">📊</div>
        <h3>Token 用量统计</h3>
        <p>统计 Trae / Codex / Claude / DeepSeek 等工具的 token 用量与费用，支持目录扫描与导入导出。</p>
      </a>
    </div>
  </section>

  <footer>纯前端项目 · 无需安装，点击即玩</footer>
</body>
</html>
