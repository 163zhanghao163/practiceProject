<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>像素大冒险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    background: #0d0d1a;
    color: #fff;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 16px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 10px; letter-spacing: 2px; text-shadow: 2px 2px #ff0066; }
  /* 画布自适应：不超屏宽，也不超可视高度（130px 留给标题+说明） */
  #wrap {
    position: relative;
    width: min(96vw, 960px, calc((100vh - 130px) * 16 / 9));
    width: min(96vw, 960px, calc((100svh - 130px) * 16 / 9));
  }
  canvas {
    display: block;
    width: 100%; height: auto; aspect-ratio: 16 / 9;
    background: #5c94fc;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #222;
    box-shadow: 0 0 0 4px #444, 0 12px 40px rgba(0,0,0,.6);
    touch-action: none;
  }
  #hint { margin-top: 12px; color: #8a8fb0; font-size: .85rem; text-align: center; line-height: 1.6; max-width: 980px; }
  kbd {
    background: #22243a; border: 1px solid #4a4e6e; border-bottom-width: 3px;
    border-radius: 4px; padding: 1px 7px; color: #cfd3ff; font-family: inherit;
  }
  /* 触屏虚拟按键：仅触控设备显示 */
  #touch { display: none; }
  @media (pointer: coarse) {
    body { padding-bottom: 110px; }
    #touch {
      display: flex; justify-content: space-between; align-items: flex-end;
      position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 16px;
      z-index: 5; pointer-events: none;
    }
    #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
    #touch button {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.45); background: rgba(30,30,60,.5);
      color: #fff; font-size: 1.5rem; font-family: inherit;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #touch button:active { background: rgba(255,255,255,.28); }
    #touch #t-jump { width: 84px; height: 84px; font-size: 1.15rem; border-color: #ffce54; color: #ffce54; }
    #touch #t-restart { width: 46px; height: 46px; font-size: 1rem; align-self: flex-start; }
  }
  /* 横屏矮窗口（手机横过来玩）：隐藏标题说明，画布占满 */
  @media (max-height: 520px) {
    h1, #hint { display: none; }
    body { padding: 6px; }
    #wrap {
      width: min(98vw, 960px, calc((100vh - 20px) * 16 / 9));
      width: min(98vw, 960px, calc((100svh - 20px) * 16 / 9));
    }
  }
</style>
</head>
<body>
  <h1>像素大冒险</h1>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="touch">
    <div class="grp"><button id="t-left" aria-label="向左">◀</button><button id="t-right" aria-label="向右">▶</button></div>
    <div class="grp"><button id="t-restart" aria-label="重开本关">↻</button><button id="t-jump">跳</button></div>
  </div>
  <p id="hint">
    <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 移动 &nbsp;·&nbsp;
    <kbd>空格</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 跳跃 &nbsp;·&nbsp; <kbd>R</kbd> 重开本关 &nbsp;·&nbsp; <kbd>M</kbd> 静音<br />
    触屏设备：屏幕下方有虚拟按键，点「跳」也可开始游戏<br />
    红色<b>弹跳板</b>可弹上高空 · 站上<b>移动平台</b>会载你过岩浆 · <b>蝙蝠</b>会飞但也能踩 ·
    落地即连踩可翻倍得分（200→400→800…）· 第 3 关终点旗需要集齐金币解锁！
  </p>
<script>
(function () {
  "use strict";
  const TILE = 40, VIEW_W = 960, VIEW_H = 540;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  // 图例: . 空气  # 地面  B 砖块  ? 问号砖  o 金币  ^ 尖刺  ~ 熔岩
  //       P 出生点  E 行走敌人  G 飞行蝙蝠  F 终点旗  | 平台
  //       J 弹跳板  M 水平移动平台(2格宽)  V 垂直移动平台(2格宽)
  const LEVELS = [
    {
      name: "第 1 关 · 绿野草原",
      sky: "#5c94fc", ground: "#3aa832", dirt: "#7a4a21", brick: "#c86428",
      map: [
        "....................................................................................................",
        "....................................................................................................",
        "....................................................................................................",
        "....................................................................................................",
        "....................................................................................................",
        ".................................o.o................................................................",
        "....................................................................................................",
        "..........................o.o.......................................o.o.............................",
        "..........................|||.................B?B...................|||.............................",
        "....................................................................................................",
        "...P......o.o.o.........E.........J.................E...^^................E.............o.o.....F...",
        "##################...##################...##################...##################...################",
        "##################...##################...##################...##################...################",
      ]
    },
    {
      name: "第 2 关 · 幽暗洞窟",
      sky: "#1a1230", ground: "#5a5a72", dirt: "#3c3c50", brick: "#8a5aa0",
      map: [
        "..............................................................................................................",
        "..............................................................................................................",
        "..............................................................................................................",
        ".......................................................o.o....................................................",
        "..............................................................................................................",
        "..............................................................................................................",
        "........................................................V.....................................................",
        "...................G.......................G......o.o..............G..........................................",
        "..............................B?B.................|||................................................B?B......",
        "................M........................M.......................M............................................",
        "...P...............................^^.....................^^E.............E.....^^.o.o.......E....^^....o.oF..",
        "#############~~~~~~~~~~################~~~~~~~~################~~~~~~~~###############~~~#####################",
        "#############~~~~~~~~~~################~~~~~~~~################~~~~~~~~###############~~~#####################",
      ]
    },
    {
      name: "第 3 关 · 熔岩要塞",
      sky: "#2b0f14", ground: "#6e3038", dirt: "#471e24", brick: "#b05030",
      coinGate: 8,
      map: [
        "........................................................................................................................",
        "........................................................................................................................",
        "........................................................................................................................",
        "......................................................o.o...............................................................",
        "........................................................................................................................",
        "...............................o.o.................................................................o.o..................",
        ".......................................................V................................................................",
        "................G.......................G........o.o...........G......................G.................................",
        "........................B?B......................|||....................G.....B?B.......................................",
        ".............M.......................M.......................M.....................M....................................",
        "...P..................E......^^.J.............E.........o.o..........E.....^^..............E...^^...J.o.o......E.o.o.F..",
        "###########~~~~~~~~################~~~~~~~~################~~~~~~~###############~~~~~~~#################~~~############",
        "###########~~~~~~~~################~~~~~~~~################~~~~~~~###############~~~~~~~#################~~~############",
      ]
    }
  ];

  const GRAV = 0.5, MOVE = 0.55, MAX_SPD = 3.6, JUMP = -13.0, SPRING_V = -18, FRICTION = 0.8;

  let levelIdx = 0, lives = 3, score = 0, state = "title";
  let player, enemies, coins, spikes, solids, lava, movers, flag, msgTimer = 0, msgText = "", clearTimer = 0;
  let levelCoinsGot = 0, flagLocked = false;
  const keys = {};
  let camX = 0, tick = 0;
  let parts = [], texts = [], shakeT = 0, hurtT = 0;
  const LS_BEST = "pixel-best";
  let bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem(LS_BEST)) || 0; } catch (e) { /* 隐私模式 */ }

  // ---------- WebAudio 合成音效（零素材，M 键静音） ----------
  const SFX = (() => {
    let ac = null, muted = false;
    try { muted = localStorage.getItem("pixel-muted") === "1"; } catch (e) { /* 隐私模式 */ }
    function a() {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }
    function tone(freq, dur, type, vol, when = 0, slideTo = 0) {
      const c = a(); if (!c || muted) return;
      const t0 = c.currentTime + when;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, when = 0) {
      const c = a(); if (!c || muted) return;
      const t0 = c.currentTime + when, n = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = c.createBufferSource(); s.buffer = buf;
      const g = c.createGain(); g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      s.connect(g).connect(c.destination); s.start(t0);
    }
    return {
      get muted() { return muted; },
      toggle() { muted = !muted; try { localStorage.setItem("pixel-muted", muted ? "1" : "0"); } catch (e) { /* 隐私模式 */ } return muted; },
      start() { tone(523, 0.09, "square", 0.08); tone(784, 0.14, "square", 0.08, 0.08); },
      jump()  { tone(300, 0.13, "square", 0.07, 0, 560); },
      coin()  { tone(988, 0.06, "square", 0.07); tone(1319, 0.16, "square", 0.07, 0.055); },
      stomp() { noise(0.09, 0.16); tone(220, 0.1, "triangle", 0.12, 0, 90); },
      combo(n) { tone(440 * Math.pow(1.122, Math.min(n, 8)), 0.1, "square", 0.09); },
      spring() { tone(240, 0.22, "square", 0.09, 0, 720); },
      bump()  { tone(120, 0.07, "triangle", 0.09, 0, 70); },
      hurt()  { tone(320, 0.22, "sawtooth", 0.11, 0, 90); noise(0.14, 0.1); },
      clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, "square", 0.08, i * 0.09)); },
      win()   { [523, 659, 784, 1047, 784, 1319].forEach((f, i) => tone(f, 0.14, "square", 0.08, i * 0.1)); },
      over()  { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, "triangle", 0.1, i * 0.13)); },
    };
  })();

  // ---------- 粒子与漂浮文字 ----------
  function puff(x, y, col, n, spread, up) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x, y,
        vx: (Math.random() * 2 - 1) * (spread || 1.8),
        vy: up ? -(1 + Math.random() * 2.2) : (Math.random() * 2 - 1) * 1.4,
        life: 12 + Math.random() * 14, col, sz: 2 + Math.random() * 2.5,
      });
    }
  }
  function floatText(x, y, t, col) { texts.push({ x, y, t, col, life: 46 }); }

  // 熔岩要塞的上升火星（背景氛围粒子）
  const embers = Array.from({ length: 45 }, (_, i) => ({
    x: (i * 137) % VIEW_W, y: (i * 211) % VIEW_H, s: 0.4 + (i % 7) * 0.12, ph: i
  }));

  function tryStart() {
    if (state !== "title" && state !== "gameover" && state !== "win") return;
    if (state === "win") { levelIdx = 0; lives = 3; score = 0; }
    SFX.start();
    loadLevel(levelIdx);
    state = "play";
  }
  document.addEventListener("keydown", e => {
    if (["ArrowLeft","ArrowRight","ArrowUp"," ","Spacebar"].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key === " " || e.key === "Spacebar") keys["space"] = true;
    if (e.key.toLowerCase() === "r" && state === "play") loadLevel(levelIdx);
    if (e.key.toLowerCase() === "m") setMsg(SFX.toggle() ? "🔇 已静音" : "🔊 声音开启", 50);
    if (e.key === "Enter" || e.key === " ") tryStart();
  });
  document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
    if (e.key === " " || e.key === "Spacebar") keys["space"] = false;
  });

  // ---------- 触屏虚拟按键 ----------
  function bindTouchBtn(id, down, up) {
    const el = document.getElementById(id);
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件无真实指针，忽略 */ }
      down();
    });
    const off = e => { e.preventDefault(); up(); };
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("contextmenu", e => e.preventDefault());
  }
  bindTouchBtn("t-left",  () => { keys["arrowleft"] = true; },  () => { keys["arrowleft"] = false; });
  bindTouchBtn("t-right", () => { keys["arrowright"] = true; }, () => { keys["arrowright"] = false; });
  bindTouchBtn("t-jump",  () => { keys["space"] = true; tryStart(); }, () => { keys["space"] = false; });
  bindTouchBtn("t-restart", () => { if (state === "play") loadLevel(levelIdx); else tryStart(); }, () => {});
  canvas.addEventListener("pointerdown", e => { e.preventDefault(); tryStart(); });

  function loadLevel(idx) {
    const L = LEVELS[idx];
    enemies = []; coins = []; spikes = []; solids = []; lava = []; movers = []; flag = null;
    levelCoinsGot = 0;
    const map = L.map;
    for (let r = 0; r < map.length; r++) {
      for (let c = 0; c < map[r].length; c++) {
        const ch = map[r][c], x = c * TILE, y = r * TILE;
        if (ch === "#") solids.push({ x, y, w: TILE, h: TILE, t: "ground" });
        else if (ch === "B" || ch === "?") solids.push({ x, y, w: TILE, h: TILE, t: ch === "?" ? "q" : "brick", used: false });
        else if (ch === "|") solids.push({ x, y, w: TILE, h: TILE/2, t: "plat" });
        else if (ch === "J") solids.push({ x, y, w: TILE, h: TILE, t: "spring", squash: 0 });
        else if (ch === "o") coins.push({ x: x + TILE/2, y: y + TILE/2, taken: false });
        else if (ch === "^") spikes.push({ x: x + 4, y: y + TILE - 14, w: TILE - 8, h: 14 });
        else if (ch === "~") lava.push({ x, y, w: TILE, h: TILE });
        else if (ch === "P") player = { x: x + 4, y: y, w: 26, h: 34, vx: 0, vy: 0, onGround: false, face: 1, inv: 60, coyote: 0, jbuf: 0, prevJump: false, onMover: null, sqx: 1, sqy: 1, chain: 0 };
        else if (ch === "E") enemies.push({ x, y: y + 8, w: 30, h: 28, vx: 0.8, dead: 0 });
        else if (ch === "G") enemies.push({ x, y, w: 30, h: 24, ox: x, oy: y, phase: c * 0.7, t: 0, vx: 0, dead: 0, fly: true });
        else if (ch === "M") movers.push({ x, y: y + 12, w: TILE * 2, h: 16, ox: x, oy: y + 12, axis: "x", range: 90, speed: 0.022, phase: c, dx: 0, dy: 0 });
        else if (ch === "V") movers.push({ x, y: y + 12, w: TILE * 2, h: 16, ox: x, oy: y + 12, axis: "y", range: 80, speed: 0.03, phase: c, dx: 0, dy: 0 });
        else if (ch === "F") flag = { x: x + TILE/2, y: y + TILE };
      }
    }
    // 标记地表砖块（最上层的草皮/石面）
    const gset = new Set(solids.filter(s => s.t === "ground").map(s => s.x + "," + s.y));
    for (const s of solids) if (s.t === "ground") s.top = !gset.has(s.x + "," + (s.y - TILE));
    flagLocked = !!L.coinGate;
    camX = 0;
    parts = []; texts = []; shakeT = 0; hurtT = 0;
  }

  function setMsg(t, f) { msgText = t; msgTimer = f; }

  function collideSolids(e, dx, dy) {
    e.x += dx;
    for (const s of solids) {
      if (s.t === "plat") continue;
      if (hit(e, s)) { if (dx > 0) e.x = s.x - e.w; else if (dx < 0) e.x = s.x + s.w; e.vx = 0; }
    }
    e.y += dy;
    e.onGround = false;
    for (const s of solids) {
      if (!hit(e, s)) continue;
      if (s.t === "plat") {
        if (dy > 0 && e.y + e.h - dy <= s.y + 6) { e.y = s.y - e.h; e.vy = 0; e.onGround = true; }
        continue;
      }
      if (dy > 0) {
        e.y = s.y - e.h; e.vy = 0; e.onGround = true;
        if (e === player) {
          if (s.t === "spring") {
            e.vy = SPRING_V; e.onGround = false; s.squash = 14;
            SFX.spring(); shakeT = Math.max(shakeT, 5);
            puff(s.x + TILE / 2, s.y + 6, "#ffb0b0", 10, 2.4, true);
          }
          else bump(s);
        }
      } else if (dy < 0) { e.y = s.y + s.h; e.vy = 0; if (e === player) bump(s); }
    }
  }
  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function bump(s) {
    if (s.t === "q" && !s.used) {
      s.used = true; score += 100;
      SFX.coin();
      puff(s.x + TILE / 2, s.y, "#ffd700", 7, 1.8, true);
      coins.push({ x: s.x + TILE/2, y: s.y - TILE/2, taken: false, pop: 30 });
    }
  }

  function update() {
    tick++;
    if (msgTimer > 0) msgTimer--;
    // 粒子与漂浮文字（所有状态都更新，通关演出不冻结）
    for (const pt of parts) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life--; }
    parts = parts.filter(pt => pt.life > 0);
    for (const t of texts) { t.y -= 0.8; t.life--; }
    texts = texts.filter(t => t.life > 0);
    if (hurtT > 0) hurtT--;
    if (state === "clear") {
      clearTimer--;
      if (clearTimer <= 0) {
        if (levelIdx < LEVELS.length - 1) { levelIdx++; loadLevel(levelIdx); state = "play"; }
        else {
          state = "win"; SFX.win();
          if (score > bestScore) { bestScore = score; try { localStorage.setItem(LS_BEST, String(bestScore)); } catch (e) { /* 隐私模式 */ } }
        }
      }
      return;
    }
    if (state !== "play") return;

    const L = LEVELS[levelIdx], mapW = L.map[0].length * TILE;

    // 1) 移动平台先走，记录本帧位移
    for (const m of movers) {
      const px_ = m.x, py_ = m.y;
      const off = Math.sin(tick * m.speed + m.phase) * m.range;
      if (m.axis === "x") { m.x = m.ox + off; m.y = m.oy; }
      else { m.x = m.ox; m.y = m.oy + off; }
      m.dx = m.x - px_; m.dy = m.y - py_;
    }

    // 2) 玩家物理
    const p = player;
    const left = keys["arrowleft"] || keys["a"], right = keys["arrowright"] || keys["d"];
    if (left) { p.vx -= MOVE; p.face = -1; }
    if (right) { p.vx += MOVE; p.face = 1; }
    if (!left && !right && p.onGround) p.vx *= FRICTION;
    if (Math.abs(p.vx) < 0.05) p.vx = 0;
    p.vx = Math.max(-MAX_SPD, Math.min(MAX_SPD, p.vx));
    if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
    const wantJump = keys["space"] || keys["arrowup"] || keys["w"];
    if (wantJump && !p.prevJump) p.jbuf = 8;
    p.prevJump = wantJump;
    if (p.jbuf > 0) p.jbuf--;
    if (p.jbuf > 0 && p.coyote > 0) {
      p.vy = JUMP; p.coyote = 0; p.jbuf = 0; p.onGround = false;
      p.sqx = 0.8; p.sqy = 1.2; p.chain = 0;              // 起跳拉伸，重置连踩
      SFX.jump();
      puff(p.x + p.w / 2, p.y + p.h, "rgba(255,255,255,.7)", 5, 1.6, false);
    }
    if (!wantJump && p.vy < -4.5) p.vy = -4.5;
    p.vy = Math.min(p.vy + GRAV, 14);
    const wasAir = !p.onGround, fallV = p.vy;
    collideSolids(p, p.vx, p.vy);
    if (wasAir && p.onGround) {                           // 落地：挤压变形 + 扬尘 + 重落地震屏
      p.sqx = Math.min(1.3, 1 + fallV / 40); p.sqy = Math.max(0.7, 1 - fallV / 40);
      if (fallV > 5) {
        puff(p.x + 4, p.y + p.h, "rgba(255,255,255,.55)", 4, 2, false);
        puff(p.x + p.w - 4, p.y + p.h, "rgba(255,255,255,.55)", 4, 2, false);
        if (fallV > 10) shakeT = Math.max(shakeT, 4);
      }
    }
    if (p.onGround && Math.abs(p.vx) > 2.4 && tick % 10 === 0)   // 奔跑扬尘
      puff(p.x + p.w / 2 - p.face * 8, p.y + p.h, "rgba(255,255,255,.35)", 1, 1, false);
    p.sqx += (1 - p.sqx) * 0.16; p.sqy += (1 - p.sqy) * 0.16;    // 形变回弹

    // 3) 移动平台载客：落上即吸附，并随平台移动
    p.onMover = null;
    for (const m of movers) {
      const bottom = p.y + p.h;
      if (p.x + p.w > m.x && p.x < m.x + m.w && p.vy >= 0 && bottom >= m.y && bottom <= m.y + m.h + 10) {
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.onMover = m;
      }
    }
    if (p.onMover) p.x += p.onMover.dx;
    p.x = Math.max(0, Math.min(p.x, mapW - p.w));
    if (p.inv > 0) p.inv--;

    // 掉落 / 熔岩 / 尖刺
    if (p.y > VIEW_H + 100 || lava.some(l => hit(p, l)) || spikes.some(s => hit(p, s) && p.vy > -2)) hurt();

    // 金币
    for (const c of coins) {
      if (c.taken) continue;
      if (c.pop) { c.pop--; c.y -= 1.5; if (c.pop === 0) c.taken = true; continue; }
      if (Math.abs(p.x + p.w/2 - c.x) < 30 && Math.abs(p.y + p.h/2 - c.y) < 34) {
        c.taken = true; score += 50; levelCoinsGot++;
        SFX.coin();
        puff(c.x, c.y, "#ffd700", 6, 1.7, true);
        floatText(c.x, c.y - 10, "+50", "#ffd700");
        if (flagLocked && levelCoinsGot >= L.coinGate) { flagLocked = false; setMsg("🔑 终点旗已解锁！", 90); }
      }
    }

    // 敌人（行走 + 飞行）
    for (const en of enemies) {
      if (en.dead) { en.dead++; continue; }
      if (en.fly) {
        en.t++;
        en.x = en.ox + Math.sin(en.t * 0.02 + en.phase) * 70;
        en.y = en.oy + Math.sin(en.t * 0.033 + en.phase * 2) * 24;
      } else {
        en.vy = Math.min((en.vy || 0) + GRAV, 12);
        const ox = en.x;
        collideSolids(en, en.vx, en.vy);
        if (en.x < 0) { en.x = 0; en.vx = Math.abs(en.vx); }
        if (en.x > mapW - en.w) { en.x = mapW - en.w; en.vx = -Math.abs(en.vx); }
        if (en.x === ox) en.vx *= -1;
        if (en.y > VIEW_H + 80) en.dead = 1;
      }
      if (p.inv === 0 && hit(p, en)) {
        if (p.vy > 1.5 && p.y + p.h < en.y + en.h * 0.7) {
          en.dead = 1; p.vy = JUMP * 0.7;
          p.chain++;                                       // 连踩加分：200/400/800/1600
          const gain = Math.min(1600, 200 * Math.pow(2, p.chain - 1));
          score += gain;
          SFX.stomp(); SFX.combo(p.chain);
          shakeT = Math.max(shakeT, 3);
          p.sqx = 1.25; p.sqy = 0.75;
          puff(en.x + en.w / 2, en.y + en.h / 2, "#ffffff", 10, 2.6, true);
          puff(en.x + en.w / 2, en.y + en.h / 2, "#ffd24a", 6, 2.2, true);
          floatText(en.x + en.w / 2, en.y - 6, "+" + gain, "#ffe98a");
        }
        else hurt();
      }
    }

    // 终点旗（第 3 关需金币解锁）
    if (flag && Math.abs(p.x + p.w/2 - flag.x) < 30 && p.y + p.h > flag.y - TILE * 2) {
      if (flagLocked) {
        if (msgTimer <= 0) setMsg(`🔒 还需 ${L.coinGate - levelCoinsGot} 枚金币解锁终点旗`, 60);
      } else {
        score += 500;
        SFX.clear();
        for (let i = 0; i < 3; i++) puff(flag.x, flag.y - 60, ["#ffd700", "#7fff7f", "#7ad0ff"][i], 9, 2.6, true);
        state = "clear"; clearTimer = 100;
      }
    }

    camX += ((p.x - VIEW_W * 0.4) - camX) * 0.12;
    camX = Math.max(0, Math.min(camX, mapW - VIEW_W));
  }

  function hurt() {
    if (player.inv > 0) return;
    lives--;
    SFX.hurt(); shakeT = 10; hurtT = 14;
    puff(player.x + 13, player.y + 17, "#ff6b6b", 12, 2.6, true);
    if (lives <= 0) {
      state = "gameover";
      SFX.over();
      if (score > bestScore) { bestScore = score; try { localStorage.setItem(LS_BEST, String(bestScore)); } catch (e) { /* 隐私模式 */ } }
      return;
    }
    loadLevel(levelIdx);
  }

  // ---- 绘制 ----
  function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (n & 255) + amt));
    return `rgb(${r},${g},${b})`;
  }

  function drawBackground(L) {
    // 天空渐变
    const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    if (levelIdx === 0) { sky.addColorStop(0, "#3f8cff"); sky.addColorStop(0.65, "#8fc4ff"); sky.addColorStop(1, "#d6ecff"); }
    else if (levelIdx === 1) { sky.addColorStop(0, "#0b0817"); sky.addColorStop(1, "#241a3e"); }
    else { sky.addColorStop(0, "#1a0d12"); sky.addColorStop(0.7, "#3d1414"); sky.addColorStop(1, "#61201a"); }
    ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (levelIdx === 0) {
      // 太阳
      px(792, 54, 48, 48, "#fff7d6"); px(800, 62, 32, 32, "#ffe98a");
      // 远山（两层视差）
      ctx.fillStyle = "#6d97c9";
      for (let i = 0; i < 6; i++) {
        const mx = ((i * 340 - camX * 0.15) % (VIEW_W + 680) + VIEW_W + 680) % (VIEW_W + 680) - 340;
        ctx.beginPath(); ctx.moveTo(mx, 420); ctx.lineTo(mx + 170, 250 + (i % 2) * 44); ctx.lineTo(mx + 340, 420); ctx.fill();
      }
      ctx.fillStyle = "#8fb7e3";
      for (let i = 0; i < 6; i++) {
        const mx = ((i * 380 - camX * 0.25) % (VIEW_W + 760) + VIEW_W + 760) % (VIEW_W + 760) - 380;
        ctx.beginPath(); ctx.moveTo(mx, 430); ctx.lineTo(mx + 190, 316 + (i % 2) * 30); ctx.lineTo(mx + 380, 430); ctx.fill();
      }
      // 树线（中视差）
      for (let i = 0; i < 9; i++) {
        const tx = ((i * 240 - camX * 0.4) % (VIEW_W + 480) + VIEW_W + 480) % (VIEW_W + 480) - 240;
        px(tx + 27, 404, 12, 42, "#6a4326"); px(tx + 30, 404, 3, 42, "#7d5230");
        ctx.fillStyle = i % 2 ? "#2f7d33" : "#37913c";
        ctx.beginPath(); ctx.moveTo(tx - 4, 414); ctx.lineTo(tx + 34, 414); ctx.lineTo(tx + 15, 350); ctx.fill();
        ctx.fillStyle = i % 2 ? "#3d9442" : "#4aa84f";
        ctx.beginPath(); ctx.moveTo(tx + 2, 382); ctx.lineTo(tx + 29, 382); ctx.lineTo(tx + 15, 338); ctx.fill();
      }
      // 云（快视差）
      for (let i = 0; i < 5; i++) {
        const cx = ((i * 260 - camX * 0.5) % (VIEW_W + 320) + VIEW_W + 320) % (VIEW_W + 320) - 160;
        const cy = 48 + i * 20;
        px(cx + 20, cy + 8, 44, 12, "rgba(255,255,255,.93)");
        px(cx + 34, cy, 30, 14, "rgba(255,255,255,.93)");
        px(cx + 26, cy + 4, 16, 7, "#f4f8ff");
      }
    } else if (levelIdx === 1) {
      // 洞窟：悬浮微光 + 钟乳石 + 发光水晶
      for (let i = 0; i < 40; i++) {
        const sx = ((i * 137 - camX * 0.3) % VIEW_W + VIEW_W) % VIEW_W, sy = (i * 89) % 240;
        px(sx, sy, 2, 2, "rgba(180,160,255,.45)");
      }
      ctx.fillStyle = "#120c22";
      for (let i = 0; i < 8; i++) {
        const sx = ((i * 170 - camX * 0.5) % (VIEW_W + 200) + VIEW_W + 200) % (VIEW_W + 200) - 100;
        const h = 50 + (i % 3) * 34;
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + 26, 0); ctx.lineTo(sx + 13, h); ctx.fill();
      }
      for (let i = 0; i < 6; i++) {
        const cx2 = ((i * 300 - camX * 0.45) % (VIEW_W + 300) + VIEW_W + 300) % (VIEW_W + 300) - 150;
        const gl = 0.55 + Math.sin(tick * 0.05 + i * 2) * 0.35;
        ctx.globalAlpha = gl * 0.3;
        px(cx2 - 4, 462, 30, 12, "#7ad0ff");
        ctx.globalAlpha = gl;
        ctx.fillStyle = "#b0e4ff";
        ctx.beginPath(); ctx.moveTo(cx2, 504); ctx.lineTo(cx2 + 7, 458); ctx.lineTo(cx2 + 14, 504); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx2 + 13, 504); ctx.lineTo(cx2 + 19, 472); ctx.lineTo(cx2 + 25, 504); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else {
      // 熔岩要塞：远处火山 + 城垛剪影 + 火星
      ctx.fillStyle = "#26090b";
      for (let i = 0; i < 5; i++) {
        const vx = ((i * 420 - camX * 0.18) % (VIEW_W + 840) + VIEW_W + 840) % (VIEW_W + 840) - 420;
        ctx.beginPath(); ctx.moveTo(vx, 430); ctx.lineTo(vx + 210, 206 + (i % 2) * 50); ctx.lineTo(vx + 420, 430); ctx.fill();
      }
      ctx.fillStyle = "#1a0608";
      for (let i = 0; i < 10; i++) {
        const fx = ((i * 190 - camX * 0.32) % (VIEW_W + 380) + VIEW_W + 380) % (VIEW_W + 380) - 190;
        px(fx, 352, 92, 88, "#1a0608");
        for (let m = 0; m < 3; m++) px(fx + 6 + m * 30, 338, 18, 16, "#1a0608");
      }
      ctx.fillStyle = "rgba(255,90,40,.5)";
      for (let i = 0; i < 10; i++) {
        const fx = ((i * 190 - camX * 0.32) % (VIEW_W + 380) + VIEW_W + 380) % (VIEW_W + 380) - 190;
        px(fx + 44, 352, 4, 3, "rgba(255,110,40,.65)");
      }
      for (const em of embers) {                        // 熔岩火星上升
        em.y -= em.s;
        em.x += Math.sin(tick * 0.03 + em.ph) * 0.4;
        if (em.y < -4) { em.y = VIEW_H + 4; em.x = (em.x + 311) % VIEW_W; }
        px(em.x, em.y, 3, 3, em.s > 0.9 ? "#ff9a3d" : "#e8542a");
      }
    }
  }

  function drawPlayer(p) {
    if (p.inv > 0 && (tick >> 2) % 2) return;
    const x = Math.round(p.x), y = Math.round(p.y), f = p.face;
    ctx.save();
    ctx.translate(x + 13, y + 34);                         // 以脚底中心为锚做挤压/拉伸
    ctx.scale(p.sqx || 1, p.sqy || 1);
    ctx.translate(-x - 13, -y - 34);
    const O = "#241a2e";                                 // 全身描边色
    const run = p.onGround && Math.abs(p.vx) > 0.4;
    const step = run ? (tick >> 3) % 4 : 0;              // 四帧行走
    const bob = run && (step === 1 || step === 3) ? 1 : 0;
    const b = y + bob;                                   // 身体原点（含跑动起伏）
    if (p.onGround) {                                    // 脚下阴影
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.ellipse(x + 13, y + 33, 11, 3.5, 0, 0, 7); ctx.fill();
    }
    // ---- 帽子 ----
    px(x + 3, b + 1, 20, 6, O);
    px(x + 4, b + 2, 18, 3, "#e84343");
    px(x + 4, b + 1, 18, 2, "#ff6b6b");
    px(f > 0 ? x + 17 : x + 1, b + 4, 8, 2, "#c22525");  // 帽檐朝向脸
    // ---- 脸 ----
    px(x + 4, b + 6, 18, 11, O);
    px(x + 5, b + 7, 16, 9, "#ffc98f");
    px(f > 0 ? x + 5 : x + 17, b + 7, 4, 5, "#7a4322");  // 后脑勺头发
    px(f > 0 ? x + 14 : x + 8, b + 9, 3, 4, "#20242e");  // 眼睛
    px(f > 0 ? x + 15 : x + 8, b + 9, 1, 1, "#ffffff");  // 眼中高光
    px(f > 0 ? x + 15 : x + 7, b + 13, 4, 1, "#e89a6a"); // 腮红
    // ---- 身体 ----
    px(x + 3, b + 16, 20, 10, O);
    px(x + 4, b + 17, 18, 7, "#2f66d0");
    px(x + 4, b + 17, 18, 2, "#5a8ae8");                 // 衣服高光
    px(x + 4, b + 23, 18, 3, "#4a2f1a");                 // 腰带
    px(x + 11, b + 23, 4, 3, "#ffd23b");                 // 金扣
    const arm = run ? (step < 2 ? 1 : -1) : (p.onGround ? 0 : -2);
    px(x + 1, b + 17 + arm, 3, 7, O); px(x + 2, b + 18 + arm, 2, 5, "#ffc98f");           // 后手
    px(x + 22, b + 17 - arm, 3, 7, O); px(x + 22, b + 18 - arm, 2, 5, "#ffc98f");         // 前手
    // ---- 腿脚 ----
    if (p.onGround) {
      const la = step === 1 ? 3 : step === 3 ? -3 : 0;
      px(x + 5, b + 25, 8, 9, O); px(x + 13, b + 25, 8, 9, O);
      px(x + 6, b + 26 + Math.max(0, -la), 6, 7 - Math.max(0, -la), "#6a4525");
      px(x + 14, b + 26 + Math.max(0, la), 6, 7 - Math.max(0, la), "#5a3a1a");
      px(x + 6 + Math.max(0, la * -1) * 0, b + 32, 6, 2, "#33210f");   // 鞋底
      px(x + 14, b + 32, 6, 2, "#33210f");
    } else {                                             // 空中姿势：前腿抬起后腿后蹬
      px(x + 4, b + 25, 9, 9, O); px(x + 13, b + 25, 9, 9, O);
      px(x + 5, b + 26, 7, 5, "#5a3a1a"); px(x + 3, b + 29, 6, 3, "#33210f");
      px(x + 14, b + 26, 7, 5, "#6a4525"); px(x + 17, b + 29, 5, 3, "#33210f");
    }
    ctx.restore();
  }

  function drawEnemy(en) {
    if (en.dead) return;
    const x = Math.round(en.x), y = Math.round(en.y);
    if (en.fly) {
      // ---- 蝙蝠：扇动双翼 + 黄眼獠牙 ----
      const f = Math.sin(tick * 0.25 + en.phase) * 5;
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.beginPath(); ctx.ellipse(x + 15, y + 30, 9, 2.5, 0, 0, 7); ctx.fill();
      const O = "#1c0f2a";
      ctx.fillStyle = "#5a2a78";                           // 左翼
      ctx.beginPath();
      ctx.moveTo(x + 11, y + 8); ctx.lineTo(x + 1, y + 2 + f); ctx.lineTo(x - 4, y + 11 + f);
      ctx.lineTo(x + 3, y + 13 + f * 0.6); ctx.lineTo(x + 10, y + 13); ctx.fill();
      ctx.fillStyle = "#5a2a78";                           // 右翼
      ctx.beginPath();
      ctx.moveTo(x + 21, y + 8); ctx.lineTo(x + 31, y + 2 - f); ctx.lineTo(x + 36, y + 11 - f);
      ctx.lineTo(x + 29, y + 13 - f * 0.6); ctx.lineTo(x + 22, y + 13); ctx.fill();
      px(x + 10, y - 4, 3, 6, O); px(x + 19, y - 4, 3, 6, O);           // 耳朵
      px(x + 10, y - 3, 2, 3, "#7a3fa0"); px(x + 20, y - 3, 2, 3, "#7a3fa0");
      px(x + 7, y + 2, 18, 17, O);                                       // 身体描边
      px(x + 8, y + 3, 16, 15, "#7a3fa0");
      px(x + 8, y + 12, 16, 6, "#5a2a78");                               // 腹部阴影
      px(x + 10, y + 6, 4, 4, "#ffe98a"); px(x + 18, y + 6, 4, 4, "#ffe98a");
      px(x + 11, y + 7, 2, 2, "#6a5400"); px(x + 19, y + 7, 2, 2, "#6a5400");
      px(x + 11, y + 13, 2, 3, "#ffffff"); px(x + 19, y + 13, 2, 3, "#ffffff");   // 獠牙
    } else {
      // ---- 蘑菇怪：红帽白点 + 怒目小脚 ----
      const wob = Math.sin(tick * 0.14 + en.x * 0.05) * 2;
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.beginPath(); ctx.ellipse(x + 15, y + 28, 13, 3.5, 0, 0, 7); ctx.fill();
      const lp = Math.sin(tick * 0.2 + en.x * 0.09) * 3;   // 双脚交替
      px(x + 3 + lp, y + 22, 10, 6, "#4a2c16"); px(x + 17 - lp, y + 22, 10, 6, "#3a2210");
      px(x + 5, y + 9, 20, 15, "#f2e3c8");                              // 蘑菇柄
      px(x + 5, y + 9, 20, 4, "#fff8ea");
      px(x + 5, y + 20, 20, 4, "#dcc9a8");
      px(x + 8, y + 13, 4, 5, "#2a1a12"); px(x + 18, y + 13, 4, 5, "#2a1a12");   // 眼
      px(x + 7, y + 11, 6, 2, "#2a1a12"); px(x + 17, y + 11, 6, 2, "#2a1a12");   // 怒眉
      px(x + 12, y + 19, 6, 2, "#b06a4a");                              // 嘴
      px(x + 1, y - 3 + wob, 28, 14, "#8a2020");                        // 菌盖
      px(x + 2, y - 2 + wob, 26, 11, "#d84040");
      px(x + 4, y - 1 + wob, 12, 3, "#f06a6a");                         // 盖顶高光
      px(x + 5, y + 3 + wob, 5, 5, "#fff4e8");                          // 白斑点
      px(x + 17, y + 1 + wob, 4, 4, "#fff4e8");
      px(x + 12, y + 6 + wob, 3, 3, "#ffd9d9");
      px(x + 1, y + 9 + wob, 28, 2, "#a82828");                         // 盖沿
    }
  }

  function draw() {
    const L = LEVELS[levelIdx];
    drawBackground(L);
    ctx.save();
    const sx = shakeT > 0 ? ((Math.random() * 10 - 5) | 0) : 0;
    const sy = shakeT > 0 ? ((Math.random() * 8 - 4) | 0) : 0;
    if (shakeT > 0) shakeT--;
    ctx.translate(-Math.round(camX) + sx, sy);

    for (const m of movers) {
      if (m.x + m.w < camX - 60 || m.x > camX + VIEW_W + 60) continue;
      px(m.x, m.y, m.w, m.h, "#3a4258");
      px(m.x, m.y, m.w, 4, "#c8d4f0");
      px(m.x, m.y, m.w, 7, "#8a96b8");
      px(m.x, m.y + m.h - 3, m.w, 3, "#262c3e");
      for (let i = 0; i < m.w - 8; i += 16) {           // 黄黑警示条
        px(m.x + 4 + i, m.y + 9, 8, 4, "#e8b820");
        px(m.x + 12 + i, m.y + 9, 8, 4, "#2a3040");
      }
    }

    for (const s of solids) {
      if (s.x + s.w < camX - 60 || s.x > camX + VIEW_W + 60) continue;
      if (s.t === "ground") {
        px(s.x, s.y, s.w, s.h, L.dirt);
        px(s.x + 6, s.y + 16, 5, 4, shade(L.dirt, -22));       // 土壤颗粒
        px(s.x + 24, s.y + 28, 6, 4, shade(L.dirt, -22));
        px(s.x + 15, s.y + 10, 4, 3, shade(L.dirt, 16));
        px(s.x + 30, s.y + 20, 4, 3, shade(L.dirt, -16));
        if (s.top) {
          const g = L.ground;
          px(s.x, s.y, s.w, 10, g);
          px(s.x, s.y, s.w, 3, shade(g, 30));
          px(s.x, s.y + 10, s.w, 2, shade(g, -34));
          px(s.x + 5, s.y - 3, 2, 3, g);                       // 草叶/石笋尖
          px(s.x + 14, s.y - 5, 2, 5, shade(g, 22));
          px(s.x + 28, s.y - 4, 2, 4, g);
        }
      } else if (s.t === "plat") {
        px(s.x, s.y, s.w, s.h, shade(L.brick, -50));
        px(s.x + 1, s.y, s.w - 2, s.h - 2, L.brick);
        px(s.x + 1, s.y, s.w - 2, 3, shade(L.brick, 50));
        px(s.x + 1, s.y + s.h - 4, s.w - 2, 2, shade(L.brick, -36));
      } else if (s.t === "q") {
        if (s.used) {
          px(s.x, s.y, s.w, s.h, "#4a4230");
          px(s.x + 1, s.y + 1, s.w - 2, s.h - 2, "#6a5f42");
          px(s.x + 1, s.y + 1, s.w - 2, 2, "#7d7154");
        } else {
          const gl = Math.sin(tick * 0.1) > 0;
          px(s.x, s.y, s.w, s.h, "#8a5a00");
          px(s.x + 1, s.y + 1, s.w - 2, s.h - 2, "#e8a820");
          px(s.x + 1, s.y + 1, s.w - 2, 3, "#f8d860");
          px(s.x + 3, s.y + 3, 3, 3, "#8a5a00"); px(s.x + s.w - 6, s.y + 3, 3, 3, "#8a5a00");
          px(s.x + 3, s.y + s.h - 6, 3, 3, "#8a5a00"); px(s.x + s.w - 6, s.y + s.h - 6, 3, 3, "#8a5a00");
          ctx.font = "bold 24px 'Courier New', monospace";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillStyle = gl ? "#ffffff" : "#ffe98a";
          ctx.fillText("?", s.x + s.w / 2, s.y + s.h / 2 + 1);
          ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        }
      } else if (s.t === "spring") {
        const sq = s.squash > 0 ? 8 : 0;
        if (s.squash > 0) s.squash--;
        px(s.x + 4, s.y + 34, 32, 6, "#3a3a46");              // 底座
        px(s.x + 4, s.y + 34, 32, 2, "#5a5a6a");
        px(s.x + 13, y8(s, 27) + sq, 14, 4, "#9aa4c0");       // 弹簧圈
        px(s.x + 15, y8(s, 21) + sq * 0.66, 10, 4, "#8a94b0");
        px(s.x + 13, y8(s, 15) + sq * 0.33, 14, 4, "#9aa4c0");
        px(s.x + 6, y8(s, 8) + sq, 28, 7, "#e03030");         // 顶板
        px(s.x + 6, y8(s, 8) + sq, 28, 2, "#ff7a7a");
        px(s.x + 8, y8(s, 13) + sq, 24, 2, "#a01818");
      } else {
        px(s.x, s.y, s.w, s.h, shade(L.brick, -46));          // 砖块
        px(s.x + 1, s.y + 1, s.w - 2, s.h - 2, L.brick);
        px(s.x + 1, s.y + 1, s.w - 2, 3, shade(L.brick, 44));
        px(s.x + 1, s.y + 19, s.w - 2, 2, shade(L.brick, -34));
        px(s.x + 19, s.y + 1, 2, 18, shade(L.brick, -34));
        px(s.x + 1, s.y + 37, s.w - 2, 2, shade(L.brick, -34));
        px(s.x + 9, s.y + 21, 2, 16, shade(L.brick, -34));
        px(s.x + 29, s.y + 21, 2, 16, shade(L.brick, -34));
      }
    }

    for (const l of lava) {                                   // 岩浆（此前未绘制，补上）
      if (l.x + l.w < camX - 60 || l.x > camX + VIEW_W + 60) continue;
      const wob = Math.sin(tick * 0.07 + l.x * 0.045) * 2;
      px(l.x, l.y + 3 + wob, l.w, TILE - 3 - wob, "#d43818");
      px(l.x, l.y + 3 + wob, l.w, 5, "#ff8a2a");
      px(l.x, l.y + 9 + wob, l.w, 2, "#ffd54a");
      px(l.x, l.y + TILE - 6, l.w, 6, "#8a1c0c");
      if ((tick + l.x) % 120 < 3) px(l.x + 8 + (l.x * 7 % 22), l.y - 1 + wob, 4, 4, "#ffb02a");
    }

    for (const s of spikes) {
      for (let i = 0; i < 3; i++) {
        const bx = s.x + i * (s.w / 3);
        ctx.fillStyle = "#78809a";
        ctx.beginPath();
        ctx.moveTo(bx - 1, s.y + s.h); ctx.lineTo(bx + s.w / 6, s.y - 1); ctx.lineTo(bx + s.w / 3 + 1, s.y + s.h);
        ctx.fill();
        ctx.fillStyle = "#d8dee8";
        ctx.beginPath();
        ctx.moveTo(bx + 1, s.y + s.h); ctx.lineTo(bx + s.w / 6, s.y + 1); ctx.lineTo(bx + s.w / 3 - 1, s.y + s.h);
        ctx.fill();
      }
    }
    for (const c of coins) {
      if (c.taken) continue;
      const spin = Math.abs(Math.cos(tick * 0.08)) * 10 + 4;
      ctx.fillStyle = "rgba(255,215,0,.22)";                  // 金币光晕
      ctx.beginPath(); ctx.arc(c.x, c.y, 13, 0, 7); ctx.fill();
      px(c.x - spin / 2, c.y - 9, spin, 18, "#e8a800");
      px(c.x - spin / 2 + 1, c.y - 8, Math.max(2, spin - 2), 16, "#ffd700");
      px(c.x - spin / 2 + 2, c.y - 6, Math.max(1, spin - 5), 9, "#fff3b0");
    }
    for (const en of enemies) drawEnemy(en);
    if (flag) {
      const fy = flag.y;
      px(flag.x - 6, fy - TILE * 2.6 - 7, 12, 7, flagLocked ? "#6a6a7a" : "#ffd700");   // 顶球
      px(flag.x - 3, fy - TILE * 2.6, 6, TILE * 2.6, flagLocked ? "#5a5a6a" : "#e8e8f0");
      px(flag.x - 3, fy - TILE * 2.6, 2, TILE * 2.6, flagLocked ? "#4a4a58" : "#ffffff");
      const wave = Math.sin(tick * 0.1) * 3;
      ctx.fillStyle = flagLocked ? "#7a7a8a" : "#2ecc4e";
      ctx.beginPath();
      ctx.moveTo(flag.x + 3, fy - TILE * 2.6 + 4);
      ctx.lineTo(flag.x + 44 + wave, fy - TILE * 2.2 + 6);
      ctx.lineTo(flag.x + 3, fy - TILE * 1.8 + 4);
      ctx.fill();
      if (!flagLocked) px(flag.x + 9, fy - TILE * 2.28, 9, 9, "#ffffff");   // 旗徽
      if (flagLocked) {                              // 锁
        px(flag.x - 9, fy - 74, 18, 13, "#e8b820");
        ctx.strokeStyle = "#e8b820"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(flag.x, fy - 74, 6, Math.PI, 0);
        ctx.stroke();
      }
    }
    drawPlayer(player);
    for (const pt of parts) px(pt.x, pt.y, pt.sz, pt.sz, pt.col);
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.textAlign = "center";
    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, t.life / 20);
      ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 3;
      ctx.strokeText(t.t, t.x, t.y);
      ctx.fillStyle = t.col; ctx.fillText(t.t, t.x, t.y);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = "left";
    ctx.restore();

    if (hurtT > 0) {                                       // 受伤红闪
      ctx.fillStyle = `rgba(255,40,40,${0.28 * (hurtT / 14)})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }

    drawHud();
    if (state !== "play") overlay();
  }
  function y8(s, v) { return s.y + v; }

  function drawHud() {
    const L = LEVELS[levelIdx];
    ctx.font = "bold 18px 'Courier New', monospace";
    ctx.strokeStyle = "rgba(0,0,0,.6)";
    ctx.lineWidth = 4;
    let text = `❤ × ${lives}    🪙 ${score}    ${L.name}`;
    if (L.coinGate) text += `    🔑 ${levelCoinsGot}/${L.coinGate}`;
    ctx.strokeText(text, 16, 30);
    ctx.fillStyle = "#fff";
    ctx.fillText(text, 16, 30);
    if (msgTimer > 0 && msgText) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, msgTimer / 30)})`;
      ctx.textAlign = "center";
      ctx.fillText(msgText, VIEW_W / 2, 70);
      ctx.textAlign = "left";
    }
  }

  function overlay() {
    if (state === "clear") {
      ctx.fillStyle = "rgba(8,8,20,.45)";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.textAlign = "center";
      ctx.font = "bold 40px 'Courier New', monospace";
      ctx.fillStyle = "#ffe98a";
      ctx.fillText(`🎉 ${LEVELS[levelIdx].name} 完成！ +500`, VIEW_W / 2, VIEW_H / 2 - 10);
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillStyle = "#fff";
      ctx.fillText(levelIdx < LEVELS.length - 1 ? "准备进入下一关…" : "全部关卡完成！", VIEW_W / 2, VIEW_H / 2 + 34);
      ctx.textAlign = "left";
      return;
    }
    ctx.fillStyle = "rgba(8,8,20,.78)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = "center";
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.fillStyle = state === "win" ? "#7fff7f" : state === "gameover" ? "#ff6b6b" : "#ffe98a";
    const t = state === "win" ? "🏆 通关成功！" : state === "gameover" ? "💀 游戏结束" : "像素大冒险";
    ctx.fillText(t, VIEW_W / 2, VIEW_H / 2 - 40);
    ctx.font = "20px 'Courier New', monospace";
    ctx.fillStyle = "#fff";
    const sub = state === "title"
      ? "草原 → 洞窟 → 要塞：弹跳板、移动平台、蝙蝠、金币锁"
      : state === "win" ? (score >= bestScore ? `最终得分：${score} 🏆 新纪录！` : `最终得分：${score}`)
      : `得分：${score} · 剩余生命耗尽`;
    ctx.fillText(sub, VIEW_W / 2, VIEW_H / 2 + 10);
    if (state === "title" && bestScore > 0) {
      ctx.fillStyle = "#ffe98a";
      ctx.fillText(`🏆 最佳得分：${bestScore}`, VIEW_W / 2, VIEW_H / 2 + 34);
    }
    const blink = (tick >> 5) % 2;
    if (blink) {
      ctx.fillStyle = "#ffe98a";
      ctx.fillText(state === "title" ? "按 空格 / 回车 开始游戏" : "按 空格 / 回车 重新开始", VIEW_W / 2, VIEW_H / 2 + 56);
    }
    ctx.textAlign = "left";
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loadLevel(0);
  loop();
})();
</script>
</body>
